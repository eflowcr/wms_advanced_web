version: 2

# Aviso semanal de CVE. Minor y patch van juntos en un PR; cada major va en su
# propio PR porque puede romper.

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Angular 22 fija el rango de TypeScript y de Vitest: un major acá rompe el build. Suben con
      # Angular, en su propio PR. Ver vault: Integracion Continua §11.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']

  # Las actions tambien van fijadas y tambien reciben CVE.
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
