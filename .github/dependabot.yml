version: 2

# Aviso semanal de CVE. Minor y patch van juntos en un PR; cada major va en su
# propio PR porque puede romper.

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Angular 22 pinea el rango de TypeScript en @angular/compiler-cli y el de
      # Vitest en @angular/build:unit-test. Un major aca no es actualizar, es
      # romper el build. Se suben cuando suba Angular, y como un cambio propio
      # con su PR, no por un bump automatico.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']

  # Las actions tambien van fijadas y tambien reciben CVE.
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
