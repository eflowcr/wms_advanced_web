name: CI

# Todo job rompe el build: nada es aviso. Los `name:` de los jobs son el contrato con el ruleset
# «Protect» (`Types, lint, tests, budgets` · `Playwright smoke` · `Gitleaks`): renombrar uno
# deja la PR esperando. Lo guarda tools/ci/e2e-levels.test.mjs. Ver vault: Integracion Continua §4.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Mínimo privilegio para todos los jobs: ninguno escribe en el repo (los artefactos
# usan el token del runner). Un job que necesite más lo pide en su propio bloque.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  # La del archivo oficial de sumas de esa versión; el paso de instalación verifica las dos.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

# Cada `timeout-minutes`: cuatro veces lo que tardó su job en la corrida 36360922074 (la del PR que
# fusionó 3ff8116), al minuto de arriba. Lo guarda tools/ci/workflow-hardening.test.mjs.
jobs:
  # ---------------------------------------------------------------------- verify
  verify:
    # Nombre exigido por el ruleset, letra por letra. Ver la cabecera.
    name: Types, lint, tests, budgets
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Única fuente de verdad, la misma que lee fnm en local; `engines` +
          # engine-strict en .npmrc hacen fallar un desajuste.
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (strict)
        run: npm run typecheck

      # --max-warnings=0: un warning también rompe.
      - name: ESLint (boundaries, security, zero warnings)
        run: npm run lint

      # Mitad de plantillas de la regla de seguridad: ESLint solo ve .innerHTML en TypeScript.
      - name: No [innerHTML] bindings in templates
        run: |
          if grep -rn '\[innerHTML\]' projects --include='*.html'; then
            echo "::error::[innerHTML] binding is forbidden (XSS). Render through a template or sanitise explicitly."
            exit 1
          fi
          echo "No [innerHTML] bindings found."

      # Todo valor visual sale de un token (ADR 0005, ADR 0009).
      - name: Design tokens (no raw values, no Tailwind defaults)
        run: npm run lint:tokens

      # ADR 0011: la tabla generada coincide byte a byte con una regeneración.
      - name: Icons (generated table in sync, no loose <svg>)
        run: npm run lint:icons

      # ADR 0008. Plantillas y literales de TypeScript; solo el soporte de pruebas y la marca
      # quedan fuera, con la razón en el script. Los escapes por línea se listan en el log.
      - name: i18n (keys in sync, same keys per language, no hardcoded text)
        run: npm run lint:i18n

      # REQ-FE-DS4-001 RFE-01. Escrito en DS-4 y sin cablear hasta DS-5.
      - name: Shortcut map (one map, one listener)
        run: npm run lint:shortcuts

      # REQ-FE-DS4-003 HG-02. Misma historia que el mapa de atajos.
      - name: Click budget (declared once, imported twice)
        run: npm run lint:click-budget

      # Regla 15: fuera de la biblioteca no se escribe a mano un botón, un campo, un select ni
      # una tabla; la pieza que falta se agrega al sistema.
      - name: Design system only (no native controls outside the library)
        run: npm run lint:ds

      # Regla 16: un bloque de comentario tiene tres líneas como máximo, en todo el repositorio.
      - name: Comments (three lines per block)
        run: npm run lint:comments

      # Identificadores y nombres de archivo en inglés: el texto en español vive en los diccionarios.
      - name: Identifiers in English (no Spanish names)
        run: npm run lint:identifiers

      # Antes que las pruebas: host-page.test.mjs lee la CSP del artefacto. Los presupuestos, en angular.json.
      - name: Production build and bundle budgets
        run: npm run build

      # Regla 17: lo que `/` carga antes de pintar, contra su techo; lee el browser-stats.json del build.
      - name: Critical path of / (static closure against its ceiling)
        run: npm run lint:critical-path

      - name: Vitest, coverage thresholds, axe-core
        run: npm test

      # Cada biblioteca con ng-packagr, como se publica: el build de la app no las empaqueta.
      - name: Library builds
        run: npm run build:libs

      - name: npm audit
        run: npm run audit:ci

  # -------------------------------------------------------------- smoke, showroom
  # smoke: todo PR y todo push. showroom: en un PR solo si cambió lo que documenta; en push,
  # siempre. Ver vault: Integracion Continua §4.1.

  smoke:
    # Nombre exigido por el ruleset, letra por letra. Ver la cabecera.
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El espejo de apt de los runners a veces deja una descarga colgada hasta el tope del job.
      # Con esto una descarga parada se corta a los 20 s y se reintenta tres veces.
      - name: Set up apt retries and timeouts
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # Una suite que no encuentra pruebas falla.
      - name: Playwright smoke suite
        run: npm run e2e:smoke

      # Seguridad verifica sus flujos sintéticos en cada PR y exige encontrar pruebas.
      - name: Playwright domain suite
        run: npm run e2e -- --project=domain

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  showroom:
    # Sin `needs:` ni `if:` a propósito: siempre corre y siempre reporta, listo para
    # el día que el ruleset lo exija. El filtro es un paso, no un job.
    name: Playwright showroom
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Hace falta la base del PR en la historia para el diff.
          fetch-depth: 0

      # Git pelado y ninguna acción de terceros: una más del marketplace ampliaría
      # el perímetro de seguridad del pipeline (PLN-WMS-003 §8) a cambio de nada.
      - name: Decide whether the showroom suite has to run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Push to a long-lived branch: the showroom suite always runs."
            echo "showroom=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          # Lo que la suite defiende y lo que usa: bibliotecas, shell, specs, su servidor, las
          # dependencias, lo que arma el build y las compuertas. La prueba e2e-levels lee esta expresión.
          if printf '%s\n' "$CHANGED" | grep -Eq '^(projects/(design-system|showroom|shell|core|shared)/|e2e/|tools/(e2e|ci)/|playwright[^/]*\.ts$|package(-lock)?\.json$|angular\.json$|tsconfig[^/]*\.json$)'; then
            echo "showroom=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the showroom documents changed: the suite does not run."
            echo "showroom=false" >> "$GITHUB_OUTPUT"
          fi

      # Un paso saltado no salta el job: el check se reporta igual, cosa que un
      # `if:` en el job nunca garantiza.
      - name: Set up Node
        if: steps.filter.outputs.showroom == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.filter.outputs.showroom == 'true'
        run: npm ci

      # El espejo de apt de los runners a veces deja una descarga colgada hasta el tope del job.
      # Con esto una descarga parada se corta a los 20 s y se reintenta tres veces.
      - name: Set up apt retries and timeouts
        if: steps.filter.outputs.showroom == 'true'
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null

      - name: Install Playwright browser
        if: steps.filter.outputs.showroom == 'true'
        run: npx playwright install chromium --with-deps

      # Una máquina y no tres: el sharding medido costó 58 % más de máquina por
      # 48 s de reloj. Una corrida, un reporte html. Ver vault: Integracion Continua.md.
      - name: Playwright showroom suite
        if: steps.filter.outputs.showroom == 'true'
        run: npm run e2e:showroom

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-showroom
          path: playwright-report/
          retention-days: 7

  secrets:
    # Nombre exigido por el ruleset, letra por letra. Ver la cabecera.
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historia completa: el escaneo cubre cada commit de la rama.
          fetch-depth: 0

      # El binario directo: gitleaks-action pide licencia en repos de organización.
      # Nada se abre sin verificar: la suma fijada arriba y la del archivo oficial de la versión.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd /tmp
          curl -sSLf -o "$tarball" "$base/$tarball"
          curl -sSLf -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check --strict
          grep " $tarball\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner

      - name: Scan working tree for secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
