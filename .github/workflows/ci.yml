name: CI

# Every job below FAILS the build. Nothing here is advisory.
# If a gate is too strict, the gate changes deliberately -- it is never demoted
# to a warning to get a branch green.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned once here; every job reuses it.
  GITLEAKS_VERSION: '8.30.1'

jobs:
  # ------------------------------------------------------ gates 1,2,3,5,6,8,9,10,11,12
  verify:
    name: Types, lint, tests, budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Single source of truth: the same file fnm reads locally.
          # package.json `engines` + `.npmrc` engine-strict make a mismatch fail loudly.
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate 1 -- any type error fails the build.
      - name: Gate 1 - TypeScript (strict)
        run: npm run typecheck

      # Gate 2 + Gate 9 -- boundary rules and security rules are both ESLint errors.
      # --max-warnings=0 means a warning is a failure too.
      - name: Gate 2 + 9 - ESLint (boundaries, security, zero warnings)
        run: npm run lint

      # Gate 9 (template half) -- the ESLint rule covers .innerHTML in TypeScript;
      # this covers the [innerHTML] binding in Angular templates.
      - name: Gate 9 - no [innerHTML] bindings in templates
        run: |
          if grep -rn '\[innerHTML\]' projects --include='*.html'; then
            echo "::error::[innerHTML] binding is forbidden (XSS). Render through a template or sanitise explicitly."
            exit 1
          fi
          echo "No [innerHTML] bindings found."

      # Gate 10 -- every visual value comes from a design token (ADR 0005, ADR 0009).
      # Fails on raw hex / rgb() / rgba() / hsl() / px, on Tailwind default utilities
      # (bg-blue-500 carries no hex and still bypasses the system), and on primitive
      # tokens used outside tokens.css -- the single file where raw values are legitimate.
      - name: Gate 10 - Design tokens (no raw values, no Tailwind defaults)
        run: npm run lint:tokens

      # Gate 11 -- icons (ADR 0011). icons.generated.ts must match a fresh
      # regeneration byte for byte (like a lockfile), and no template may hold a
      # hand-written <svg>: every icon goes through <ewms-icon>.
      - name: Gate 11 - Icons (generated table in sync, no loose <svg>)
        run: npm run lint:icons

      # Gate 12 -- i18n (ADR 0008). Keys used vs. defined in both directions
      # (transloco-keys-manager), identical key sets in every dictionary,
      # canonical dictionary format with valid ICU, and no hardcoded human
      # text in templates. The showroom is exempt; the reason lives in the script.
      - name: Gate 12 - i18n (keys in sync, same keys per language, no hardcoded text)
        run: npm run lint:i18n

      # Gate 13 -- the shortcut map (REQ-FE-DS4-001 RFE-01). Every key is named
      # in a map file and nowhere else, and exactly one global keyboard
      # listener exists. Built in DS-4 and, until DS-5, never wired here: the
      # script existed, `npm run lint:shortcuts` ran it, and nothing in CI
      # called it. A gate that only runs when somebody remembers is not a gate.
      - name: Gate 13 - Shortcut map (one map, one listener)
        run: npm run lint:shortcuts

      # Gate 14 -- the click budget (REQ-FE-DS4-003 HG-02). The four numbers
      # are declared once, and both the screen and the end-to-end test import
      # them rather than restating them. Same history as gate 13: written in
      # DS-4, wired in DS-5.
      - name: Gate 14 - Click budget (declared once, imported twice)
        run: npm run lint:click-budget

      # Gate 3 + Gate 5 -- unit tests, coverage thresholds, and the axe-core
      # accessibility harness all run in this one Vitest suite.
      - name: Gate 3 + 5 - Vitest, coverage thresholds, axe-core
        run: npm test

      # Gate 8 -- bundle budgets live in angular.json; exceeding maximumError fails here.
      - name: Gate 8 - Production build and bundle budgets
        run: npm run build

      # Gate 6 -- dependency vulnerabilities.
      - name: Gate 6 - npm audit
        run: npm run audit:ci

  # ----------------------------------------------------------------- gate 4a/4b
  #
  # THE SUITE RUNS IN LEVELS, AND THE NUMBER THAT FORCED IT IS 183 x 1 WORKER.
  #
  # Until DS-5 this was ONE job running every end-to-end test with a single
  # Playwright worker. That is 183 tests in a queue on a two-core runner, and
  # the direction of travel was the problem rather than the minutes: every
  # domain of DS-6 adds screens, every screen adds tests, and all of them would
  # have joined the same queue.
  #
  #   smoke     the application boots, every route answers, the three patterns
  #             still work on the keyboard. EVERY pull request and every push,
  #             no exceptions, under two minutes.
  #
  #   showroom  the catalogue's own documentation -- the component sheets, the
  #             icon table, the dictionaries, the click budget. On a pull
  #             request it runs only when something it documents changed; on a
  #             push to development or main it always runs. Three shards.
  #
  # GATE 4 IS STILL BLOCKING. `e2e-showroom-gate` below always runs and fails
  # when the sharded suite ran and was not green, so there is one required
  # check whose name never disappears from a pull request -- which a job with
  # an `if:` cannot promise, because a skipped required check is not the same
  # thing to GitHub as a passing one.

  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      showroom: ${{ steps.filter.outputs.showroom }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The base of the pull request has to be in the history to diff it.
          fetch-depth: 0

      # Plain git, and no third-party action. A path filter is four lines of
      # shell; a marketplace action for it would be one more dependency inside
      # the pipeline's own security perimeter (PLN-WMS-003 section 8), bought
      # for nothing.
      - name: Decide whether the showroom suite has to run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Push to a long-lived branch: the showroom suite always runs."
            echo "showroom=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          # What the showroom suite actually defends: the library, the
          # catalogue, the shell's layout (which its axe and keyboard walks
          # cross on every page), the specs themselves, and the Playwright
          # configuration.
          if printf '%s\n' "$CHANGED" | grep -Eq '^(projects/design-system/|projects/showroom/|projects/shell/src/app/layout/|e2e/|playwright[^/]*\.ts$)'; then
            echo "showroom=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the showroom documents changed."
            echo "showroom=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-smoke:
    name: Gate 4a - Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # Gate 4a -- boots the real app, walks every route, and runs one flow per
      # pattern on the keyboard alone.
      - name: Gate 4a - Playwright smoke test
        run: npm run e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  e2e-showroom:
    name: Gate 4b - Playwright showroom (shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.showroom == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One shard failing must not cancel the other two: the point of a merged
      # report is seeing every failure in one place, not the first one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # `blob` and not `html`: a shard's own html report is a third of the
      # truth. The blobs are merged below into one report that reads like one
      # run.
      - name: Gate 4b - Playwright showroom suite
        run: npx playwright test --project=showroom --shard=${{ matrix.shard }}/3 --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  e2e-showroom-report:
    name: Playwright showroom report
    needs: [changes, e2e-showroom]
    if: ${{ !cancelled() && needs.changes.outputs.showroom == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the shards' blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-showroom
          path: playwright-report/
          retention-days: 7

  e2e-showroom-gate:
    name: Gate 4b - Playwright showroom
    needs: [changes, e2e-showroom]
    # ALWAYS, and that is the whole point: this is the check branch protection
    # requires. When the suite did not have to run it passes and says so; when
    # it ran and was not green it fails. An `if:` on the sharded job alone
    # would make the required check vanish from the pull request instead of
    # passing it.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: The showroom suite must be green whenever it ran
        env:
          NEEDED: ${{ needs.changes.outputs.showroom }}
          RESULT: ${{ needs.e2e-showroom.result }}
        run: |
          if [ "$NEEDED" != "true" ]; then
            echo "Nothing the showroom documents changed: the suite did not run."
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::The showroom suite is not green ($RESULT)."
            exit 1
          fi
          echo "The showroom suite is green."

  # ------------------------------------------------------------------------ gate 7
  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the scan covers every commit on the branch, not just the tip.
          fetch-depth: 0

      # The binary is used directly rather than gitleaks-action, which requires a
      # licence key for organisation-owned repositories.
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Gate 7 -- any detected secret fails the build.
      - name: Gate 7 - Scan git history for secrets
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner

      - name: Gate 7 - Scan working tree for secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
