name: CodeQL

# SAST que exige PLN-WMS-003 §8; gratis porque el repo es público. Este archivo solo
# sube hallazgos: lo que bloquea el merge es el ruleset «Require code scanning
# results» (high o superior), que vive en GitHub. Ver vault: Integracion Continua.md §5.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    # Semanal: las consultas nuevas de CodeQL también corren sobre código sin cambios.
    - cron: '27 6 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # actions: los workflows también son superficie de ataque (inyección por datos
        # del evento, tokens con permisos de más).
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5

      # Sin build: CodeQL extrae TypeScript y los workflows directo del código fuente.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - coverage

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
