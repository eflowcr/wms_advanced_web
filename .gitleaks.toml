title = "eWMS Advance - frontend"

# Parte de las reglas de fábrica; las propias se agregan abajo cuando se conozca la
# forma real de los secretos (claves de API, cadenas de conexión).
[extend]
useDefault = true

[allowlist]
description = "Paths that are not ours to scan"
paths = [
  '''^node_modules/''',
  '''^dist/''',
  '''^coverage/''',
  '''^\.angular/''',
  '''^playwright-report/''',
  '''^test-results/''',
  '''package-lock\.json$''',
]
