# Servidor: /opt/wms/advanced/web. La consola se une a la red de la API y le pasa /api/v1/security/*.
# Ver vault: 0029 - Despliegue de la consola con nginx.
services:
  wms_advanced_web:
    image: epracsupply/wms_advanced_web:latest
    container_name: wms_advanced_web
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    cpu_shares: 256
    ports:
      - "${WEB_PORT:-8081}:8080"
    environment:
      - API_UPSTREAM=${API_UPSTREAM:-http://wms_advanced_api_sqlserver:8080}
    networks: [wms_dev_net_sqlserver]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  wms_dev_net_sqlserver:
    name: wms_dev_net_sqlserver
    external: true
