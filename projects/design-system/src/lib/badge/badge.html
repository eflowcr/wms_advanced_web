<!--
  El icono es decorativo acá, al revés que en el Banner: la etiqueta de al lado dice
  lo mismo en palabras, y un `aria-label` en el icono haría que un lector leyera la
  severidad dos veces.
-->
<span
  class="inline-flex max-w-full items-center gap-1 rounded-full border border-solid px-2 py-0.5 text-caption"
  [class]="boxClasses()"
>
  <ewms-icon [name]="iconName()" size="sm" aria-hidden="true" />
  <span class="truncate">{{ label() }}</span>
</span>
