<!-- `role` según la variante (Ver vault: Notificaciones); la caja entera es la región viva. -->
<div
  [attr.role]="role()"
  class="flex items-start gap-3 rounded-md border p-4"
  [class]="surfaceClasses()"
>
  <!-- El único icono nunca decorativo: dice la severidad, que ningún texto repite. -->
  <ewms-icon [name]="iconName()" [size]="iconSize" [label]="severityLabel()" />

  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <p class="text-h4">{{ title() }}</p>
    @if (description()) {
      <p class="text-p">{{ description() }}</p>
    }
    <!-- Lo proyectado va bajo el texto: la lista de errores del patrón Formulario, por ejemplo. -->
    <ng-content />
  </div>

  @if (dismissible()) {
    <!-- Ghost sobre color: su azul de acción es correcto, porque cerrar es el clic. -->
    <ewms-button
      [iconOnly]="true"
      variant="ghost"
      icon="x"
      size="sm"
      [label]="dismissLabel()"
      (click)="onDismiss()"
    />
  }
</div>
