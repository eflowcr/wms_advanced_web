<!--
  `[attr.type]` desde DS-5: `submit` devuelve el envío implícito con Enter. Ver vault: Boton.
  Solo ícono: `label` nombra y el tooltip la repite `aria-hidden` (`describes` en false).
-->
<button
  [attr.type]="type()"
  [class]="baseClasses + ' ' + boxClass() + ' ' + variantClasses()"
  [style.fontSize]="iconOnly() ? null : fontSize()"
  [style.fontWeight]="'var(--text-control-weight)'"
  [ewmsTooltip]="label() ?? ''"
  [tooltipDisabled]="!iconOnly()"
  [describes]="false"
  [disabled]="disabled()"
  [attr.aria-label]="iconOnly() ? label() : null"
  [attr.aria-labelledby]="iconOnly() ? null : contentId"
  [attr.aria-disabled]="ariaDisabled()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-pressed]="pressed()"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="controls()"
  (click)="onButtonClick($event)"
  (keydown)="onButtonKeydown($event)"
>
  <span
    [id]="contentId"
    class="inline-flex items-center justify-center gap-2"
    [class.invisible]="loading()"
  >
    @if (hasLeftIcon()) {
      <ewms-icon [name]="icon()!" [size]="iconSize()" aria-hidden="true" />
    }
    @if (!iconOnly()) {
      <ng-content />
    }
    @if (hasRightIcon()) {
      <ewms-icon [name]="icon()!" [size]="iconSize()" aria-hidden="true" />
    }
  </span>

  @if (loading()) {
    <span
      class="absolute inset-0 flex items-center justify-center pointer-events-none"
      [style.color]="spinnerColor()"
      aria-hidden="true"
    >
      <ewms-icon name="spinner" [size]="iconSize()" aria-hidden="true" />
    </span>
  }
</button>
