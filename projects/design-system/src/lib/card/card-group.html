<!--
  El grupo es el radiogroup y su nombre es la etiqueta que pasó el consumidor. No
  hay encabezado visible a propósito: un selector de cards suele ir bajo una
  etiqueta de campo que la página ya dibujó, y un segundo adentro se leería dos veces.
-->
<div role="radiogroup" [attr.aria-label]="label()" class="flex flex-wrap gap-4">
  <ng-content />
</div>
