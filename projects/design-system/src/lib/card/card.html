<!--
  UN elemento para los dos usos, con los atributos interactivos atados a null cuando
  la card es un contenedor. Dos plantillas tras un `@if` serían dos `<ng-content>`
  con el mismo selector, y solo uno recibiría el contenido proyectado.
  `role`, `tabindex` y `aria-checked` están ausentes -no vacíos, ausentes- fuera de
  un grupo: un contenedor con `role="radio"` sin radiogroup alrededor es marcado
  inválido, y axe lo dice.
-->
<div
  #box
  [class]="classes()"
  [attr.role]="inGroup() ? 'radio' : null"
  [attr.tabindex]="tabIndex()"
  [attr.aria-checked]="inGroup() ? selected() : null"
  [attr.aria-disabled]="inGroup() && isDisabled() ? 'true' : null"
  (click)="onClick()"
  (keydown)="onKeydown($event)"
>
  <ng-content select="[ewmsCardHeader]" />

  <!--
  El cuerpo es el hueco por defecto, así una card seleccionable se escribe con su
  contenido adentro y una de contenido solo nombra las partes que no son el cuerpo.
-->
  <div class="flex min-w-0 flex-col gap-2">
    <ng-content />
  </div>

  <ng-content select="[ewmsCardFooter]" />

  @if (inGroup() && selected()) {
    <!--
  La tercera señal, después del borde y el relleno. Decorativa en el sentido de
  accesibilidad: `aria-checked` en la caja ya se lo dice a un lector, y decirlo dos
  veces es ruido.
-->
    <span class="text-(color:--color-bg-primary)" aria-hidden="true">
      <ewms-icon name="check" size="sm" />
    </span>
  }
</div>
