<!--
  El `<label>` ENVUELVE al control, así no hay par for/id que mantener y la fila
  entera -caja, hueco y texto- es el blanco. Por eso `cursor-pointer` va en la fila:
  el texto es parte del control, no adorno al lado.
  Sin `aria-disabled` junto al `disabled` nativo: el atributo ya lleva el estado y
  los dos lo anunciarían dos veces (misma regla que el Botón).
-->
<label [class]="rowClasses()">
  <span class="relative inline-flex">
    <input
      #box
      type="checkbox"
      [class]="boxClasses()"
      [style.borderWidth]="borderWidth"
      [checked]="controlValue()"
      [disabled]="isDisabled()"
      [attr.aria-checked]="ariaChecked()"
      [attr.aria-label]="ariaLabel() || null"
      (change)="onNativeChange($event)"
      (blur)="onBlur()"
    />

    <!--
  El glifo es un HERMANO puesto encima de la caja y no un hijo: un `<input>` no
  tiene hijos. `pointer-events-none` deja cada clic en el input de abajo.
  Los dos glifos son decoración aria-hidden: lo que el estado ES lo dice
  `aria-checked`, que sabe decir `mixed` donde el dibujo solo dice «azul».
-->
    <span [class]="glyphClasses">
      @if (indeterminate()) {
        <ewms-icon name="minus" size="sm" />
      } @else if (controlValue()) {
        <ewms-icon name="check" size="sm" />
      }
    </span>
  </span>

  @if (label()) {
    <span>{{ label() }}</span>
  }
</label>
