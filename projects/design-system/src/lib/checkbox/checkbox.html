<!--
  El `<label>` envuelve: sin for/id, y la fila entera (caja, hueco y texto) es el blanco.
  Sin `aria-disabled` junto al nativo: se anunciaría dos veces (misma regla que el Botón).
-->
<label [class]="rowClasses()">
  <span class="relative inline-flex">
    <input
      #box
      type="checkbox"
      [class]="boxClasses()"
      [style.borderWidth]="borderWidth"
      [checked]="controlValue()"
      [disabled]="isDisabled()"
      [attr.aria-checked]="ariaChecked()"
      [attr.aria-label]="ariaLabel() || null"
      [attr.aria-invalid]="fieldError() ? 'true' : null"
      [attr.aria-describedby]="fieldError() ? fieldErrorId : null"
      (change)="onNativeChange($event)"
      (blur)="onBlur()"
    />

    <!-- Hermano, porque un `<input>` no tiene hijos; el estado lo dice `aria-checked`. -->
    <span [class]="glyphClasses">
      @if (indeterminate()) {
        <ewms-icon name="minus" size="sm" />
      } @else if (controlValue()) {
        <ewms-icon name="check" size="sm" />
      }
    </span>
  </span>

  @if (label()) {
    <span>{{ label() }}{{ requiredByForm() ? ' *' : '' }}</span>
  }

  <!-- En la misma fila: el host es `inline-flex` y una línea debajo rompería toda la maqueta. -->
  @if (fieldError()) {
    <span [id]="fieldErrorId" class="text-caption text-danger">{{ fieldError() }}</span>
  }
</label>
