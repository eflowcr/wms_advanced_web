<!--
  The `role="dialog"`, the focus trap, the `aria-modal` and the focus
  restoration all live on the CDK's container around this template. What is
  here is the content and nothing else -- which is why there is no role on this
  element: a second `dialog` role nested inside the first would be two dialogs
  as far as a screen reader is concerned.
-->
<div [class]="boxClasses">
  <!--
    THE ICON ZONE IS A SHAPE WITH A HALO AND NO GLYPH, AND THAT IS ON PURPOSE.

    It is a documented exception in the Modal sheet, carrying an explicit
    warning for whoever arrives later with the icon set in hand: do NOT "fix"
    this by putting a triangle in it. The shape was validated with the user on
    27/08; changing it is a decision somebody takes, not a gap to tidy up.

    aria-hidden because there is nothing here to read: the tone is already in
    the title and in the words of the body, and a circle has no name.
  -->
  <span
    class="shrink-0 rounded-full border border-solid"
    [class]="iconClasses()"
    [style.width]="'var(--size-dialog-icon)'"
    [style.height]="'var(--size-dialog-icon)'"
    aria-hidden="true"
  ></span>

  <h2 [id]="options.titleId" class="text-h3 text-primary">{{ options.title }}</h2>
  <p [id]="options.bodyId" class="text-p text-secondary">{{ options.body }}</p>

  <!--
    The footer is right-aligned while the title and the body are centred, which
    is what the sheet's v1.1 settles on. Cancel first in the DOM, so the
    keyboard reaches the safe answer before the destructive one: the CDK puts
    the focus on the first tabbable element, and that has to be Cancel.
  -->
  <div class="flex w-full justify-end gap-2">
    <ewms-button variant="secondary" (click)="cancel()">{{ options.cancelLabel }}</ewms-button>
    <ewms-button [variant]="confirmVariant()" (click)="confirm()">
      {{ options.confirmLabel }}
    </ewms-button>
  </div>
</div>
