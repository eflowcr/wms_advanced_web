<!--
  El `role="dialog"`, la trampa de foco, el `aria-modal` y la devolución del foco
  viven en el contenedor del CDK. Acá está el contenido y nada más, y por eso este
  elemento no lleva rol: un segundo `dialog` anidado serían dos diálogos.
-->
<div [class]="boxClasses">
  <!--
  LA ZONA DEL ICONO ES UNA FORMA CON HALO Y SIN GLIFO, Y ES A PROPÓSITO. Es una
  excepción documentada en la ficha Modal, con aviso explícito para quien llegue
  después con el set de iconos en la mano: NO «arreglarla» metiéndole un triángulo.
  La forma se validó con el usuario el 27/08.
  `aria-hidden` porque no hay nada que leer: el tono ya está en el título y en el
  cuerpo, y un círculo no tiene nombre.
-->
  <span
    class="shrink-0 rounded-full border border-solid"
    [class]="iconClasses()"
    [style.width]="'var(--size-dialog-icon)'"
    [style.height]="'var(--size-dialog-icon)'"
    aria-hidden="true"
  ></span>

  <h2 [id]="options.titleId" class="text-h3 text-primary">{{ options.title }}</h2>
  <p [id]="options.bodyId" class="text-p text-secondary">{{ options.body }}</p>

  <!--
  El pie va alineado a la derecha mientras el título y el cuerpo van centrados, que
  es lo que fija la v1.1 de la ficha. Cancelar primero en el DOM, así el teclado
  llega a la respuesta segura antes que a la destructiva: el CDK pone el foco en el
  primer tabulable, y ese tiene que ser Cancelar.
-->
  <div class="flex w-full justify-end gap-2">
    <ewms-button variant="secondary" (click)="cancel()">{{ options.cancelLabel }}</ewms-button>
    <ewms-button [variant]="confirmVariant()" (click)="confirm()">
      {{ options.confirmLabel }}
    </ewms-button>
  </div>
</div>
