<!-- `<nav>` propio: landmark «Favoritos» aparte, y las flechas del árbol no visitan filas ajenas. -->
<nav
  class="border-b py-3"
  [class]="blockClasses()"
  data-favorites-nav
  [attr.aria-label]="label()"
>
  @if (expanded()) {
    <h2 class="pb-2 text-caption uppercase" [class]="textInset()">{{ label() }}</h2>
  }

  @if (shown().length === 0) {
    <!-- Vacío explica cómo llenarlo; plegado, una estrella lleva esas palabras como nombre. -->
    @if (expanded()) {
      <p class="text-caption" [class]="textInset()" data-favorites-empty>{{ emptyLabel() }}</p>
    } @else {
      <!-- Sin foco ni tooltip: `role="img"` con nombre; un `tabindex="0"` sería una parada vacía. -->
      <div class="flex justify-center py-2" data-favorites-empty>
        <ewms-icon name="star" size="lg" [label]="emptyLabel()" />
      </div>
    }
  } @else {
    <!-- `aria-label` solo plegado, como en el rail: el tooltip describe, no nombra. -->
    <ul class="list-none">
      @for (row of shown(); track row.favorite.route) {
        <li>
          <button
            type="button"
            class="flex w-full items-center gap-4 rounded-lg py-2 text-left outline-none focus-visible:shadow-(--focus-ring-shadow)"
            [class]="rowClasses(row.favorite.route)"
            [attr.data-favorite]="row.favorite.route"
            [attr.aria-label]="expanded() ? null : row.label"
            [attr.aria-current]="activeRoute() === row.favorite.route ? 'page' : null"
            [ewmsTooltip]="row.label"
            [tooltipDisabled]="expanded()"
            position="right"
            (click)="onSelect(row.favorite)"
          >
            @if (expanded()) {
              <ewms-icon [name]="row.icon" size="lg" />
              <span class="min-w-0 flex-1 truncate">{{ row.label }}</span>
            } @else {
              <!-- Plegado, lo activo rodea solo el ícono, como en el árbol del rail. -->
              <span
                class="flex rounded-full px-4 py-1"
                [class]="indicatorClasses(row.favorite.route)"
                data-favorite-indicator
              >
                <ewms-icon [name]="row.icon" size="lg" />
              </span>
            }
          </button>
        </li>
      }
    </ul>
  }
</nav>
