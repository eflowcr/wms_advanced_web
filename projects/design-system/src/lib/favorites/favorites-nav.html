<!--
  Un `<nav>` propio con nombre, y no parte del `<nav>` del árbol. Dos razones: la
  lista de landmarks tiene que decir «Favoritos» y «Menú principal» por separado,
  porque son dos maneras distintas de llegar a algún lado; y el teclado de foco
  móvil del árbol camina el MENÚ, así que un favorito metido ahí sería una fila que
  las flechas visitan y el shell nunca puso.
-->
<nav
  class="border-b px-2 py-3"
  [class]="tone().text + ' ' + tone().border"
  data-favorites-nav
  [attr.aria-label]="label()"
>
  @if (expanded()) {
    <h2 class="px-2 pb-2 text-caption uppercase">{{ label() }}</h2>
  }

  @if (shown().length === 0) {
    <!--
  EL ESTADO VACÍO NO ES UN ESPACIO EN BLANCO: es el único lugar que dice cómo
  llenar el bloque, y un bloque que desapareciera diría que la función no existe.
  Plegado no hay lugar para una frase, así que una estrella la reemplaza y lleva
  las palabras como nombre accesible.
-->
    @if (expanded()) {
      <p class="px-2 text-caption" data-favorites-empty>{{ emptyLabel() }}</p>
    } @else {
      <!--
  NO ENFOCABLE Y SIN TOOLTIP. Un `tabindex="0"` sobre algo que no es un control para
  colgarle un tooltip es justo el defecto que la caminata por teclado de DS-2
  encontró en la propia página del Tooltip: una parada que no hace nada. El icono
  lleva `label`, así que es `role="img"` con nombre y un lector igual se entera.
-->
      <div class="flex justify-center py-2" data-favorites-empty>
        <ewms-icon name="star" size="lg" [label]="emptyLabel()" />
      </div>
    }
  } @else {
    <!--
  `aria-label` solo cuando está plegado, la misma regla que el rail: un tooltip
  describe y no nombra, y una fila sin texto visible y sin label es un botón que
  nadie puede identificar.
-->
    <ul class="list-none">
      @for (row of shown(); track row.favorite.route) {
        <li>
          <button
            type="button"
            class="flex w-full items-center gap-3 rounded-sm py-2 text-left text-p outline-none focus-visible:shadow-(--focus-ring-shadow) aria-[current=page]:bg-primary aria-[current=page]:text-h4 aria-[current=page]:text-on-primary"
            [class]="(expanded() ? 'px-2' : 'justify-center px-1') + ' ' + tone().hover"
            [attr.data-favorite]="row.favorite.route"
            [attr.aria-label]="expanded() ? null : row.label"
            [attr.aria-current]="activeRoute() === row.favorite.route ? 'page' : null"
            [ewmsTooltip]="row.label"
            [tooltipDisabled]="expanded()"
            position="right"
            (click)="onSelect(row.favorite)"
          >
            <ewms-icon [name]="row.icon" size="lg" />
            @if (expanded()) {
              <span class="min-w-0 flex-1 truncate">{{ row.label }}</span>
            }
          </button>
        </li>
      }
    </ul>
  }
</nav>
