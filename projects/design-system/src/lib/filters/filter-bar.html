<!-- Aplica al cambiar un campo: sin botón «Aplicar», que solo agrega un clic y una duda. -->
<div class="flex flex-wrap items-end gap-3" data-filter-bar>
  @for (field of visible(); track field.key) {
    <div class="min-w-(--col-width-md) flex-1 basis-60 max-w-80" [attr.data-field]="field.key">
      @switch (field.kind) {
        @case ('select') {
          <ewms-select
            size="sm"
            [label]="field.label"
            [options]="selectOptions(field)"
            [value]="boxValue(field)"
            (valueChange)="change(field, $any($event))"
          />
        }
        @case ('date-range') {
          <ewms-date-picker
            mode="range"
            size="sm"
            [label]="field.label"
            [value]="$any(boxValue(field))"
            (valueChange)="change(field, $event)"
          />
        }
        @default {
          <ewms-input
            type="search"
            size="sm"
            [label]="field.label"
            [value]="$any(boxValue(field))"
            (valueChange)="change(field, $event)"
          />
        }
      }
    </div>
  }

  @if (hidden().length > 0) {
    <ewms-button
      class="mb-0.5"
      variant="ghost"
      size="sm"
      [icon]="expanded() ? 'chevron-up' : 'chevron-down'"
      iconPosition="right"
      [expanded]="expanded()"
      data-more-filters
      (click)="expanded.set(!expanded())"
    >
      {{ expanded() ? text.fewerFilters : text.moreFilters(hiddenActive()) }}
    </ewms-button>
  }
</div>

<!-- La misma pieza que la barra de la tabla: un solo lugar decide cómo se ve un filtro activo. -->
<ewms-filter-chips
  [chips]="chips()"
  [messages]="text"
  (remove)="remove($event)"
  (clearAll)="clearAll()"
/>
