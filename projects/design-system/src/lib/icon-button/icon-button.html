<!--
  El área clicable es la caja entera y no el glifo: el icono va centrado en un botón
  cuadrado, así que hasta el glifo más chico se pulsa en cualquier parte del cuadro.
  `describes` va atado y no escrito como atributo: `describes="false"` pasaría la
  cadena «false», que es verdadera, y el tooltip se conectaría por aria-describedby
  anunciándose encima del aria-label.
  `[disabled]` es el enlace nativo y queda sin ambigüedad porque la directiva de
  tooltip llama `tooltipDisabled` a su propio interruptor: si se llamara `disabled`,
  Angular resolvería este enlace a la directiva y el atributo nativo nunca se
  escribiría -un botón con cara de deshabilitado y perfectamente clicable-.
-->
<button
  type="button"
  [class]="baseClasses + ' ' + boxClass() + ' ' + variantClasses()"
  [attr.aria-label]="label()"
  [ewmsTooltip]="tooltip()"
  [describes]="false"
  [disabled]="disabled()"
  [attr.aria-disabled]="ariaDisabled()"
  [attr.aria-pressed]="pressed()"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="controlsId()"
  [attr.aria-busy]="loading() ? 'true' : null"
  (click)="onButtonClick($event)"
  (keydown)="onButtonKeydown($event)"
>
  <span class="inline-flex items-center justify-center" [class.invisible]="loading()">
    <ewms-icon [name]="icon()" [size]="iconSize()" aria-hidden="true" />
  </span>

  @if (loading()) {
    <span
      class="absolute inset-0 flex items-center justify-center pointer-events-none"
      [style.color]="spinnerColor()"
      aria-hidden="true"
    >
      <ewms-icon name="spinner" [size]="iconSize()" aria-hidden="true" />
    </span>
  }
</button>
