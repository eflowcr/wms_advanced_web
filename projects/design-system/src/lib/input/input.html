<!--
  El `<label>` es real, atado por for/id, y siempre se pinta: un placeholder no lo
  reemplaza -desaparece con la primera tecla y varios lectores no lo anuncian-.
  El asterisco va `aria-hidden`: `required` ya está en el control nativo, así que
  un lector lo dice solo, y el glifo lo diría dos veces y como «asterisco».
-->
<label [for]="fieldId" [class]="hideLabel() ? 'sr-only' : 'block text-caption text-secondary mb-1'">
  {{ label() }}
  @if (required()) {
    <span aria-hidden="true">*</span>
  }
</label>

<div class="relative block">
  @if (hasPrefixIcon()) {
    <!--
  Decorativo: sin `label`, así que se pinta aria-hidden y fuera del orden de
  tabulación. El campo ya lo nombra su `<label>`. El color se fija en el
  contenedor y el icono lo hereda por currentColor (ADR 0011).
-->
    <span
      class="absolute top-1/2 -translate-y-1/2 flex items-center pointer-events-none text-secondary"
      [class]="prefixIconOffsetClass()"
    >
      <ewms-icon name="search" [size]="iconSize" />
    </span>
  }

  @if (isTextarea()) {
    <textarea
      [id]="fieldId"
      rows="3"
      [class]="controlClasses()"
      [style.borderColor]="borderColor()"
      [style.fontSize]="fontSize()"
      [attr.placeholder]="placeholder() || null"
      [value]="controlValue()"
      [disabled]="isNativeDisabled()"
      [readOnly]="isReadonly()"
      [required]="required()"
      [attr.aria-invalid]="isInvalid() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    ></textarea>
  } @else {
    <!--
  `readOnly` es la propiedad del DOM y no el atributo `readonly`: el atributo es
  presente-o-ausente, así que atarle `false` igual dejaría el campo de solo
  lectura. Es también por qué solo-lectura NO se arma con `disabled`: conserva
  foco, parada de tabulación y selección de texto, y deshabilitado pierde las tres.
-->
    <input
      [id]="fieldId"
      [type]="nativeType()"
      [class]="controlClasses()"
      [style.borderColor]="borderColor()"
      [style.fontSize]="fontSize()"
      [attr.placeholder]="placeholder() || null"
      [value]="controlValue()"
      [disabled]="isNativeDisabled()"
      [readOnly]="isReadonly()"
      [required]="required()"
      [attr.aria-invalid]="isInvalid() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />
  }

  @if (hasSuffix()) {
    <!--
  La excepción a la regla del icono decorativo: este se pulsa, así que es un
  `ewms-icon-button` con nombre obligatorio y traducido. `size="sm"` es el cuadrado
  más chico que existe (32 px) y es para lo que está reservado el relleno derecho.
-->
    <span class="absolute top-1/2 -translate-y-1/2 right-1 flex items-center">
      @if (hasPasswordToggle()) {
        <ewms-icon-button
          [icon]="passwordToggleIcon()"
          [label]="passwordToggleLabel()"
          [tooltip]="passwordToggleLabel()"
          size="sm"
          (click)="togglePasswordVisibility()"
        />
      } @else {
        <ewms-icon-button
          icon="x"
          [label]="clearLabel()"
          [tooltip]="clearLabel()"
          size="sm"
          (click)="clear()"
        />
      }
    </span>
  }
</div>

<!--
  El hint es una DESCRIPCIÓN, por aria-describedby, y nunca parte del nombre
  accesible: un campo llamado «SKU Formato ABC-123» es un campo por el que nadie
  puede preguntar.
-->
@if (hint()) {
  <p [id]="hintId" class="mt-1 text-caption" [class]="hintClasses()">{{ hint() }}</p>
}
