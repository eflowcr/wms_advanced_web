<!-- Asterisco `aria-hidden`: el `required` nativo ya lo anuncia; el glifo lo diría dos veces. -->
<label [for]="fieldId" [class]="hideLabel() ? 'sr-only' : 'block text-caption text-secondary mb-1'">
  {{ label() }}
  @if (required()) {
    <span aria-hidden="true">*</span>
  }
</label>

<div class="relative block">
  @if (isSearch()) {
    <!-- Decorativo, sin `label`; el color lo hereda del contenedor por currentColor (ADR 0011). -->
    <span
      class="absolute top-1/2 -translate-y-1/2 flex items-center pointer-events-none text-secondary"
      [class]="prefixIconOffsetClass()"
    >
      <ewms-icon name="search" [size]="iconSize" />
    </span>
  }

  @if (isTextarea()) {
    <textarea
      [id]="fieldId"
      rows="3"
      [class]="controlClasses()"
      [style.borderColor]="borderColor()"
      [style.fontSize]="fontSize()"
      [attr.placeholder]="placeholder() || null"
      [value]="value()"
      [disabled]="isNativeDisabled()"
      [readOnly]="isReadonly()"
      [required]="required()"
      [attr.aria-invalid]="isInvalid() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    ></textarea>
  } @else {
    <!--
  `readOnly` es la propiedad: el atributo `readonly` con `false` igual bloquea. Solo lectura no
  es `disabled`: conserva foco, tabulación y selección.
-->
    <input
      [id]="fieldId"
      [type]="nativeType()"
      [class]="controlClasses()"
      [style.borderColor]="borderColor()"
      [style.fontSize]="fontSize()"
      [attr.placeholder]="placeholder() || null"
      [value]="value()"
      [disabled]="isNativeDisabled()"
      [readOnly]="isReadonly()"
      [required]="required()"
      [attr.aria-invalid]="isInvalid() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />
  }

  @if (hasSuffix()) {
    <!-- Este icono se pulsa: botón de solo ícono con nombre; `sm` (32 px) llena el relleno derecho. -->
    <span class="absolute top-1/2 -translate-y-1/2 right-1 flex items-center">
      @if (hasPasswordToggle()) {
        <ewms-button
          [iconOnly]="true"
          variant="ghost"
          [icon]="passwordToggleIcon()"
          [label]="passwordToggleLabel()"
          size="sm"
          (click)="togglePasswordVisibility()"
        />
      } @else {
        <ewms-button
          [iconOnly]="true"
          variant="ghost"
          icon="x"
          [label]="clearLabel()"
          size="sm"
          (click)="clear()"
        />
      }
    </span>
  }
</div>

<!-- El hint describe, no nombra: nadie pregunta por un campo «SKU Formato ABC-123». Con el campo
     en error, el mensaje del validador ocupa su lugar. -->
@if (note()) {
  <p [id]="hintId" class="mt-1 text-caption" [class]="hintClasses()">{{ note() }}</p>
}
