<!--
  Un `<nav>` con nombre, una cabeza proyectada, el árbol y un pie proyectado.
  EL ANCHO ES UN TOKEN Y EL CAMBIO ES UNA CLASE, no dos componentes: el rail y el
  panel son el mismo árbol a dos anchos, y dos componentes serían dos teclados.
  EL MARCADO ES UN ÁRBOL `ul`/`li` DE VERDAD CON ROLES DE ÁRBOL: la lista es lo que
  el documento realmente es, y `role="tree"` es lo que avisa que acá andan las
  flechas y no el Tab.
-->
<nav
  class="flex h-full flex-col bg-brand-navy text-on-dark"
  [class]="expanded() ? 'w-(--nav-panel-width)' : 'w-(--nav-rail-width)'"
  [attr.aria-label]="label()"
>
  <!--
  Acá va el bloque de favoritos (REQ-FE-DS4-002 RFE-04). El rail no lo sabe: sabe
  que hay un hueco sobre el árbol, y el consumidor sabe qué va en él.
-->
  <div class="shrink-0">
    <ng-content select="[navRailTop]" />
  </div>

  <ul
    class="min-h-0 flex-1 list-none overflow-y-auto overflow-x-hidden py-2"
    role="tree"
    [id]="treeId"
    [attr.aria-label]="label()"
  >
    @for (item of items(); track item.id) {
      <li role="none">
        <ng-container
          [ngTemplateOutlet]="row"
          [ngTemplateOutletContext]="{ $implicit: item, child: false }"
        />

        @if (isGroup(item) && isOpen(item)) {
          <ul class="list-none" role="group">
            @for (child of item.children; track child.id) {
              <li role="none">
                <ng-container
                  [ngTemplateOutlet]="row"
                  [ngTemplateOutletContext]="{ $implicit: child, child: true }"
                />
              </li>
            }
          </ul>
        }
      </li>
    }
  </ul>

  <!--
  Credenciales y logo del cliente. El rail no sabe qué es una credencial; sabe que
  hay un pie.
-->
  <div class="shrink-0 border-t border-strong">
    <ng-content select="[navRailFooter]" />
  </div>

  <!--
  El control de ancho vive DENTRO del rail y no en la cabecera, porque el ancho es
  estado del rail: `expanded` entra, el cambio sale, y el consumidor decide si lo
  recuerda.
-->
  <div class="flex shrink-0 p-2" [class.justify-center]="!expanded()">
    <button
      type="button"
      class="flex items-center justify-center rounded-sm p-2 outline-none hover:bg-primary-hover focus-visible:shadow-(--focus-ring-shadow)"
      data-nav-rail-toggle
      [attr.aria-label]="toggleLabel()"
      [attr.aria-expanded]="expanded()"
      [attr.aria-controls]="treeId"
      (click)="onToggleWidth()"
    >
      <ewms-icon [name]="expanded() ? 'sidebar-collapse' : 'sidebar-expand'" size="lg" />
    </button>
  </div>
</nav>

<!--
  UNA FILA, ESCRITA UNA VEZ: un grupo y un destino difieren en lo que hacen, no en
  cómo se ven, y dos copias de este marcado derivan en quince días.
  UN TOOLTIP NO ES UN NOMBRE ACCESIBLE, y por eso `aria-label` está Y es
  condicional: plegada, la fila no tiene texto visible -el tooltip sirve a quien ve
  y `aria-label` al resto-; abierta, la etiqueta ES el texto visible y una segunda
  copia derivaría el día que se tradujera una sola.
  Encontrado plegando el rail y mirando: dieciséis botones sin nombre accesible
  (WCAG 4.1.2), invisibles para axe porque nada había pintado el estado plegado.
-->
<ng-template #row let-item let-child="child">
  <button
    type="button"
    role="treeitem"
    class="flex w-full items-center gap-3 rounded-sm py-2 pr-2 text-left text-p outline-none hover:bg-primary-hover focus-visible:shadow-(--focus-ring-shadow) aria-[current=page]:bg-primary aria-[current=page]:text-h4 aria-[current=page]:text-on-primary"
    [class]="expanded() ? (child ? 'pl-10' : 'pl-4') : 'justify-center pl-2'"
    [attr.data-nav-item]="item.id"
    [attr.aria-label]="expanded() ? null : item.label"
    [tabindex]="focusTarget() === item.id ? 0 : -1"
    [attr.aria-current]="activeId() === item.id && !isGroup(item) ? 'page' : null"
    [attr.aria-selected]="activeId() === item.id"
    [attr.aria-expanded]="isGroup(item) ? isOpen(item) : null"
    [attr.aria-level]="child ? 2 : 1"
    [ewmsTooltip]="item.label"
    [tooltipDisabled]="expanded()"
    position="right"
    (click)="onActivate(item)"
    (keydown)="onKeydown($event, item)"
  >
    <ewms-icon [name]="item.icon" size="lg" />

    @if (expanded()) {
      <span class="min-w-0 flex-1 truncate">{{ item.label }}</span>

      @if (item.badge !== undefined) {
        <!--
  El número se dibuja; la palabra que lo hace significar algo la pone el consumidor
  dentro de `label`. El sistema de diseño no habla ningún idioma (ADR 0008).
-->
        <span class="rounded-full bg-primary px-2 text-caption text-on-primary">
          {{ item.badge }}
        </span>
      }

      @if (isGroup(item)) {
        <ewms-icon [name]="isOpen(item) ? 'chevron-up' : 'chevron-down'" size="sm" />
      }
    }
  </button>
</ng-template>
