<!-- Rail y panel son el mismo árbol a dos anchos (token). `ul`/`li` reales con roles de árbol: acá andan las flechas. -->
<nav
  class="flex h-full flex-col bg-brand-navy text-on-dark"
  [class]="expanded() ? 'w-(--nav-panel-width)' : 'w-(--nav-rail-width)'"
  [attr.aria-label]="label()"
>
  <!-- Favoritos (REQ-FE-DS4-002 RFE-04): el rail solo ofrece el hueco. -->
  <div class="shrink-0">
    <ng-content select="[navRailTop]" />
  </div>

  <ul
    class="min-h-0 flex-1 list-none overflow-y-auto overflow-x-hidden py-2"
    role="tree"
    [id]="treeId"
    [attr.aria-label]="label()"
  >
    @for (item of items(); track item.id) {
      <li role="none">
        <ng-container
          [ngTemplateOutlet]="row"
          [ngTemplateOutletContext]="{ $implicit: item, child: false }"
        />

        @if (isGroup(item) && isOpen(item)) {
          <ul class="list-none" role="group">
            @for (child of item.children; track child.id) {
              <li role="none">
                <ng-container
                  [ngTemplateOutlet]="row"
                  [ngTemplateOutletContext]="{ $implicit: child, child: true }"
                />
              </li>
            }
          </ul>
        }
      </li>
    }
  </ul>

  <!-- Credenciales y logo del cliente. -->
  <div class="shrink-0 border-t border-strong">
    <ng-content select="[navRailFooter]" />
  </div>

  <!-- El ancho es estado del rail: `expanded` entra, el cambio sale. -->
  @if (toggleLabel()) {
    <div class="flex shrink-0 p-2" [class.justify-center]="!expanded()">
      <button
        type="button"
        class="flex items-center justify-center rounded-sm p-2 outline-none hover:bg-primary-hover focus-visible:shadow-(--focus-ring-shadow)"
        data-nav-rail-toggle
        [attr.aria-label]="toggleLabel()"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="treeId"
        (click)="onToggleWidth()"
      >
        <ewms-icon [name]="expanded() ? 'sidebar-collapse' : 'sidebar-expand'" size="lg" />
      </button>
    </div>
  }
</nav>

<!-- `aria-label` solo plegada: el tooltip no es nombre accesible (WCAG 4.1.2). Ver vault: Navegacion. -->
<ng-template #row let-item let-child="child">
  <button
    type="button"
    role="treeitem"
    class="flex w-full items-center gap-3 rounded-sm py-2 pr-2 text-left text-p outline-none hover:bg-primary-hover focus-visible:shadow-(--focus-ring-shadow) aria-[current=page]:bg-primary aria-[current=page]:text-h4 aria-[current=page]:text-on-primary"
    [class]="expanded() ? (child ? 'pl-10' : 'pl-4') : 'justify-center pl-2'"
    [attr.data-nav-item]="item.id"
    [attr.aria-label]="expanded() ? null : item.label"
    [tabindex]="focusTarget() === item.id ? 0 : -1"
    [attr.aria-current]="activeId() === item.id && !isGroup(item) ? 'page' : null"
    [attr.aria-selected]="activeId() === item.id"
    [attr.aria-expanded]="isGroup(item) ? isOpen(item) : null"
    [attr.aria-level]="child ? 2 : 1"
    [ewmsTooltip]="item.label"
    [tooltipDisabled]="expanded()"
    position="right"
    (click)="onActivate(item)"
    (keydown)="onKeydown($event, item)"
  >
    <ewms-icon [name]="item.icon" size="lg" />

    @if (expanded()) {
      <span class="min-w-0 flex-1 truncate">{{ item.label }}</span>

      @if (item.badge !== undefined) {
        <!-- El número; la palabra la pone el consumidor en `label` (ADR 0008). -->
        <span class="rounded-full bg-primary px-2 text-caption text-on-primary">
          {{ item.badge }}
        </span>
      }

      @if (isGroup(item)) {
        <ewms-icon [name]="isOpen(item) ? 'chevron-up' : 'chevron-down'" size="sm" />
      }
    }
  </button>
</ng-template>
