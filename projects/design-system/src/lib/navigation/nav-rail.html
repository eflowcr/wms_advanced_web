<!-- Velo del cajón, el mismo de la hoja inferior: `<button>` real fuera del orden de Tab; duplica Escape. -->
@if (drawerOpen()) {
  <button
    type="button"
    class="fixed inset-0 z-10 bg-overlay"
    data-nav-drawer-veil
    tabindex="-1"
    aria-hidden="true"
    (click)="close()"
  ></button>
}

<!--
  Rail y panel son el mismo árbol a dos anchos (token). `ul`/`li` reales con roles de árbol: acá andan
  las flechas. El lado del contenido va redondeado abajo siempre y arriba solo abierto: plegado, la
  columna sigue hacia la celda de la hamburguesa. `overflow-hidden` recorta el fondo a la curva.
-->
<nav
  #panel
  class="flex flex-col overflow-hidden rounded-br-nav bg-(image:--gradient-nav) text-on-dark"
  [class]="panelClasses()"
  [attr.aria-label]="label()"
  [attr.data-nav-drawer]="drawerOpen() ? '' : null"
>
  <!--
    Fondo decorativo del consumidor, detrás de todo: el shell pone ahí las rutas animadas (decisión
    del usuario, 2026-09-25). Lo que sigue lleva `relative` para pintarse encima.
  -->
  <ng-content select="[navRailBackdrop]" />

  <!-- Favoritos (REQ-FE-DS4-002 RFE-04): el rail solo ofrece el hueco. -->
  <div class="relative shrink-0">
    <ng-content select="[navRailTop]" />
  </div>

  <ul
    class="relative min-h-0 flex-1 list-none overflow-y-auto overflow-x-hidden py-2"
    [class]="expanded() ? 'px-2.5' : 'p-0.5'"
    role="tree"
    [id]="treeId"
    [attr.aria-label]="label()"
  >
    @for (item of items(); track item.id) {
      <li role="none">
        <ng-container
          [ngTemplateOutlet]="row"
          [ngTemplateOutletContext]="{ $implicit: item, child: false }"
        />

        @if (isGroup(item) && isOpen(item)) {
          <ul class="list-none" role="group">
            @for (child of item.children; track child.id) {
              <li role="none">
                <ng-container
                  [ngTemplateOutlet]="row"
                  [ngTemplateOutletContext]="{ $implicit: child, child: true }"
                />
              </li>
            }
          </ul>
        }
      </li>
    }
  </ul>

  <!-- Logo del cliente, sin línea encima (decisión del usuario, 2026-09-25). -->
  <div class="relative shrink-0">
    <ng-content select="[navRailFooter]" />
  </div>

  <!-- El ancho es estado del rail: `expanded` entra, el cambio sale. -->
  @if (toggleLabel()) {
    <div class="relative flex shrink-0 p-2" [class.justify-center]="!expanded()">
      <button
        type="button"
        class="flex items-center justify-center rounded-sm p-2 outline-none hover:bg-primary-hover focus-visible:shadow-(--focus-ring-shadow)"
        data-nav-rail-toggle
        [attr.aria-label]="toggleLabel()"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="treeId"
        (click)="onToggleWidth()"
      >
        <ewms-icon [name]="expanded() ? 'sidebar-collapse' : 'sidebar-expand'" size="lg" />
      </button>
    </div>
  }
</nav>

<!--
  `aria-label` solo plegada: el tooltip no es nombre accesible (WCAG 4.1.2), y la etiqueta corta
  que se ve está dentro de ese nombre (WCAG 2.5.3). Ver vault: Navegacion.
-->
<ng-template #row let-item let-child="child">
  <button
    type="button"
    role="treeitem"
    class="flex w-full rounded-lg text-left outline-none focus-visible:shadow-(--focus-ring-shadow)"
    [class]="rowClasses(item, child)"
    [attr.data-nav-item]="item.id"
    [attr.aria-label]="expanded() ? null : item.label"
    [tabindex]="focusTarget() === item.id ? 0 : -1"
    [attr.aria-current]="isCurrent(item) ? 'page' : null"
    [attr.aria-selected]="activeId() === item.id"
    [attr.aria-expanded]="isGroup(item) ? isOpen(item) : null"
    [attr.aria-level]="child ? 2 : 1"
    [ewmsTooltip]="item.label"
    [tooltipDisabled]="expanded()"
    position="right"
    (click)="onActivate(item)"
    (keydown)="onKeydown($event, item)"
  >
    @if (expanded()) {
      <ewms-icon [name]="item.icon" size="lg" />
      <span class="min-w-0 flex-1 truncate">{{ item.label }}</span>

      @if (item.badge !== undefined) {
        <!-- El número; la palabra la pone el consumidor en `label` (ADR 0008). -->
        <span class="rounded-full bg-primary px-2 text-caption text-on-primary">
          {{ item.badge }}
        </span>
      }

      @if (isGroup(item)) {
        <ewms-icon [name]="isOpen(item) ? 'chevron-up' : 'chevron-down'" size="sm" />
      }
    } @else {
      <!-- Plegado, lo activo es un indicador alrededor del ícono: la etiqueta no queda apretada. -->
      <span class="flex rounded-full px-4 py-1" [class]="indicatorClasses(item)" data-nav-indicator>
        <ewms-icon [name]="item.icon" size="lg" />
      </span>
      <span class="max-w-full truncate" data-nav-short-label>{{
        item.shortLabel ?? item.label
      }}</span>
    }
  </button>
</ng-template>
