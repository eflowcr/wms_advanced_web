<!--
  UNA TIRA, DOS PIELES. El ARIA es idéntico en los dos modos porque el control es
  idéntico: un `tablist` cuyos `tab` dicen cuál está elegido. Lo que cambia es la
  pintura, y la pintura es una clase.
-->
<div
  class="flex min-w-0 items-end gap-1"
  [class.border-b]="!isDocument()"
  [class.border-default]="!isDocument()"
>
  @if (showArrows()) {
    <ewms-icon-button
      icon="chevron-left"
      size="sm"
      [label]="scrollBackLabel()"
      [tooltip]="scrollBackLabel()"
      (click)="scrollBy(-1)"
    />
  }

  <div
    #strip
    class="flex min-w-0 flex-1 items-end gap-1 overflow-x-auto"
    role="tablist"
    [id]="listId"
    [attr.aria-label]="label()"
  >
    @for (tab of tabs(); track tab.id) {
      <!--
  LA PESTAÑA ES HIJA DIRECTA DEL TABLIST, SIN NADA EN MEDIO. Un `tablist` solo
  puede tener `tab`. El primer intento puso la pestaña y un `ewms-icon-button` de
  verdad dentro de una caja `role="presentation"`: se lee bien y es una violación
  crítica de axe, que atraviesa la caja y encuentra un `button` donde solo cabe un
  `tab`.
  Así que el cierre es la respuesta de las APG para pestañas borrables: un glifo NO
  enfocable para el ratón y `Delete` para el teclado, anunciado con
  `aria-keyshortcuts` para que se descubra. Lo que no hay es un segundo tab stop
  por pestaña, y en una tira de doce documentos eso se gana.
-->
      <button
        type="button"
        role="tab"
        class="flex shrink-0 items-center gap-2 rounded-sm outline-none focus-visible:shadow-(--focus-ring-shadow) disabled:text-disabled"
        [class]="
          isDocument()
            ? activeId() === tab.id
              ? 'h-(--tab-height) rounded-t-md bg-surface px-3 text-h4 text-primary shadow-sm'
              : 'h-(--tab-height) rounded-t-md bg-secondary px-3 text-p text-secondary hover:bg-secondary-hover'
            : activeId() === tab.id
              ? 'border-b-2 border-strong px-3 py-2 text-h4 text-primary'
              : 'px-3 py-2 text-p text-secondary hover:text-primary'
        "
        [attr.data-tab]="tab.id"
        [attr.aria-selected]="activeId() === tab.id"
        [attr.aria-keyshortcuts]="isClosable(tab) ? 'Delete' : null"
        [tabindex]="activeId() === tab.id ? 0 : -1"
        [disabled]="tab.disabled === true"
        (click)="onSelect(tab)"
        (keydown)="onKeydown($event, tab)"
      >
        <span class="max-w-60 truncate">{{ tab.label }}</span>

        @if (isClosable(tab)) {
          <!--
  `aria-hidden`, y no esconde nada de nadie: esconde un DUPLICADO de una acción que
  el teclado ya tiene por `Delete`, y que un lector anunciaría como parte del
  nombre de la pestaña («Artículos Cerrar Artículos»).
  `stopPropagation` porque está dentro de la pestaña: sin él, cerrar seleccionaría.
-->
          <span
            class="flex items-center rounded-sm p-1 hover:bg-secondary-hover"
            [attr.data-tab-close]="tab.id"
            aria-hidden="true"
            (click)="onCloseGlyph($event, tab)"
          >
            <ewms-icon name="x" size="sm" />
          </span>
        }
      </button>
    }
  </div>

  @if (showArrows()) {
    <ewms-icon-button
      icon="chevron-right"
      size="sm"
      [label]="scrollForwardLabel()"
      [tooltip]="scrollForwardLabel()"
      (click)="scrollBy(1)"
    />
  }
</div>
