<!-- Mismo ARIA en los dos modos; solo cambia la pintura. -->
<div
  class="relative flex min-w-0 flex-1"
  [class.border-b]="!isDocument()"
  [class.border-default]="!isDocument()"
>
  <div
    #strip
    class="flex min-w-0 flex-1 overflow-x-auto"
    [class]="isDocument() ? 'items-center gap-2' : 'items-end gap-1'"
    role="tablist"
    [id]="listId"
    [attr.aria-label]="label()"
    (scroll)="measure()"
  >
    @for (tab of tabs(); track tab.id) {
      <!-- Tab hijo directo del tablist (axe: aria-required-children). Cierre con glifo no enfocable y `Delete`. Ver vault: Navegacion. -->
      <button
        type="button"
        role="tab"
        class="flex shrink-0 items-center gap-1 outline-none focus-visible:shadow-(--focus-ring-shadow) disabled:text-disabled"
        [class]="tabClasses(tab)"
        [attr.data-tab]="tab.id"
        [attr.aria-selected]="activeId() === tab.id"
        [attr.aria-keyshortcuts]="isClosable(tab) ? 'Delete' : null"
        [tabindex]="activeId() === tab.id ? 0 : -1"
        [disabled]="tab.disabled === true"
        (click)="onSelect(tab)"
        (keydown)="onKeydown($event, tab)"
      >
        <span class="max-w-60 truncate">{{ tab.label }}</span>

        @if (isClosable(tab)) {
          <!-- `aria-hidden`: duplica `Delete` y se leería dentro del nombre de la pestaña. -->
          <span
            class="flex items-center rounded-full p-0.5"
            [class]="closeClasses(tab)"
            [attr.data-tab-close]="tab.id"
            aria-hidden="true"
            (click)="onCloseGlyph($event, tab)"
          >
            <ewms-icon name="x" size="sm" />
          </span>
        }

        @if (!isDocument() && activeId() === tab.id) {
          <!-- Subrayado de la sección activa, como las pestañas de un canal de YouTube. -->
          <span
            class="absolute inset-x-0 bottom-0 h-(--tab-indicator-width) bg-brand-navy"
            data-tab-indicator
          ></span>
        }
      </button>
    }
  </div>

  <!-- Flechas redondas sobre los bordes, con el lienzo fundiéndose sobre los chips que pasan. -->
  @if (showBack()) {
    <div
      class="absolute inset-y-0 left-0 flex items-center pr-6 bg-(image:--gradient-chip-fade-start)"
    >
      <ewms-button
        class="[&_button]:rounded-full"
        [iconOnly]="true"
        variant="ghost"
        icon="chevron-left"
        size="sm"
        data-tabs-back
        [label]="scrollBackLabel()"
        (click)="scrollBy(-1)"
      />
    </div>
  }

  @if (showForward()) {
    <div
      class="absolute inset-y-0 right-0 flex items-center pl-6 bg-(image:--gradient-chip-fade-end)"
    >
      <ewms-button
        class="[&_button]:rounded-full"
        [iconOnly]="true"
        variant="ghost"
        icon="chevron-right"
        size="sm"
        data-tabs-forward
        [label]="scrollForwardLabel()"
        (click)="scrollBy(1)"
      />
    </div>
  }
</div>
