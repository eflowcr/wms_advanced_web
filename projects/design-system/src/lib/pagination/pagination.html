<!--
  `role="navigation"` with a name, because that is what this is: a way to get
  somewhere else in a set of results. A screen reader user landing on it out of
  context needs to know that, and the page label alone does not say it.

  The buttons are real `ewms-icon-button`s: their focus ring, their hit box and
  their disabled behaviour are already decided, and a second copy of them here
  would drift.
-->
<nav class="flex items-center justify-end gap-3" [attr.aria-label]="label()">
  @if (totalLabel()) {
    <span class="text-caption text-secondary">{{ totalLabel() }}</span>
  }

  <!--
    A live region, so moving between pages is announced. The focus stays on the
    button that was pressed -- which is right, because the next press is
    usually the same button -- and without this nothing would tell a screen
    reader that the page underneath had changed at all.
  -->
  <span class="text-caption text-primary" role="status" aria-live="polite" data-page-label>
    {{ label() }}
  </span>

  <span class="flex items-center gap-1">
    <ewms-icon-button
      icon="chevron-left"
      size="sm"
      variant="secondary"
      [label]="messages().previousPage"
      [tooltip]="messages().previousPage"
      [disabled]="atStart()"
      data-previous-page
      (click)="previous()"
    />
    <ewms-icon-button
      icon="chevron-right"
      size="sm"
      variant="secondary"
      [label]="messages().nextPage"
      [tooltip]="messages().nextPage"
      [disabled]="atEnd()"
      data-next-page
      (click)="next()"
    />
  </span>
</nav>
