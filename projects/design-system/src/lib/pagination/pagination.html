<!--
  `role="navigation"` con nombre, porque eso es esto: una forma de ir a otro lado
  dentro de un conjunto de resultados, y quien aterriza acá fuera de contexto
  necesita saberlo.
  Los botones son `ewms-icon-button` de verdad: su anillo, su caja y su
  comportamiento deshabilitado ya están decididos.
-->
<nav class="flex items-center justify-end gap-3" [attr.aria-label]="label()">
  @if (totalLabel()) {
    <span class="text-caption text-secondary">{{ totalLabel() }}</span>
  }

  <!--
  Una región viva, para que moverse entre páginas se anuncie. El foco se queda en el
  botón pulsado -que está bien, porque la próxima pulsación suele ser el mismo-, y
  sin esto nada avisaría que la página de abajo cambió.
-->
  <span class="text-caption text-primary" role="status" aria-live="polite" data-page-label>
    {{ label() }}
  </span>

  <span class="flex items-center gap-1">
    <ewms-icon-button
      icon="chevron-left"
      size="sm"
      variant="secondary"
      [label]="messages().previousPage"
      [tooltip]="messages().previousPage"
      [disabled]="atStart()"
      data-previous-page
      (click)="previous()"
    />
    <ewms-icon-button
      icon="chevron-right"
      size="sm"
      variant="secondary"
      [label]="messages().nextPage"
      [tooltip]="messages().nextPage"
      [disabled]="atEnd()"
      data-next-page
      (click)="next()"
    />
  </span>
</nav>
