<!-- Navegación con nombre: quien aterriza acá fuera de contexto necesita saber qué es. -->
<nav class="flex items-center justify-end gap-3" [attr.aria-label]="label()">
  @if (totalLabel()) {
    <span class="text-caption text-secondary">{{ totalLabel() }}</span>
  }

  <!-- El foco se queda en el botón: sin esta región viva nada avisaría el cambio de página. -->
  <span class="text-caption text-primary" role="status" aria-live="polite" data-page-label>
    {{ label() }}
  </span>

  <span class="flex items-center gap-1">
    <ewms-button
      [iconOnly]="true"
      icon="chevron-left"
      size="sm"
      variant="secondary"
      [label]="messages().previousPage"
      [disabled]="atStart()"
      data-previous-page
      (click)="previous()"
    />
    <ewms-button
      [iconOnly]="true"
      icon="chevron-right"
      size="sm"
      variant="secondary"
      [label]="messages().nextPage"
      [disabled]="atEnd()"
      data-next-page
      (click)="next()"
    />
  </span>
</nav>
