<!-- Como la casilla. El punto es un span y no un icono: un SVG entero para ocho píxeles sobra. -->
<label [class]="rowClasses()">
  <span class="relative inline-flex">
    <input
      type="radio"
      [class]="boxClasses()"
      [style.borderWidth]="borderWidth"
      [name]="name()"
      [checked]="isChecked()"
      [disabled]="isDisabled()"
      [attr.aria-checked]="isChecked() ? 'true' : 'false'"
      [attr.aria-label]="ariaLabel() || null"
      (change)="onNativeChange($event)"
      (blur)="onBlur()"
    />

    @if (isChecked()) {
      <span [class]="glyphClasses">
        <span class="size-2 rounded-full bg-(--color-text-on-primary)"></span>
      </span>
    }
  </span>

  @if (label()) {
    <span>{{ label() }}</span>
  }
</label>
