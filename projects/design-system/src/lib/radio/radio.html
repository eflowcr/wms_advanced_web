<!--
  Misma construcción que la casilla: el `<label>` envuelve al control nativo, así la
  fila entera es el blanco y el texto es el nombre accesible sin par for/id.
  El punto es un `<span>` pelado y no un icono: es un círculo lleno sin geometría, y
  un `<ewms-icon>` sería un documento SVG para dibujar ocho píxeles.
-->
<label [class]="rowClasses()">
  <span class="relative inline-flex">
    <input
      type="radio"
      [class]="boxClasses()"
      [style.borderWidth]="borderWidth"
      [name]="name()"
      [checked]="isChecked()"
      [disabled]="isDisabled()"
      [attr.aria-checked]="isChecked() ? 'true' : 'false'"
      [attr.aria-label]="ariaLabel() || null"
      (change)="onNativeChange($event)"
      (blur)="onBlur()"
    />

    @if (isChecked()) {
      <span [class]="glyphClasses">
        <!-- 8x8, centrado. `size-2` son dos pasos de 4 px. -->
        <span class="size-2 rounded-full bg-(--color-text-on-primary)"></span>
      </span>
    }
  </span>

  @if (label()) {
    <span>{{ label() }}</span>
  }
</label>
