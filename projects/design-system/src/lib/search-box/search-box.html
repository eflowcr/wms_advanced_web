<label class="sr-only" [for]="fieldId">{{ label() }}</label>

<div class="flex w-full items-stretch" [class]="heightClass">
  <div class="relative flex min-w-0 flex-1">
    <input
      #field
      type="text"
      role="searchbox"
      enterkeyhint="search"
      autocomplete="off"
      data-search-field
      [class]="fieldClasses()"
      [id]="fieldId"
      [style.fontSize]="fontSize"
      [attr.placeholder]="placeholder() || null"
      [attr.aria-keyshortcuts]="shortcut() || null"
      [value]="value()"
      [disabled]="disabled()"
      (input)="onInput($event)"
      (keydown.enter)="submit()"
    />

    <!-- Sobre el relleno derecho del campo, como el sufijo de Input. -->
    @if (hasText() && !disabled()) {
      <span class="absolute right-1 top-1/2 flex -translate-y-1/2 items-center">
        <ewms-button
          [iconOnly]="true"
          variant="ghost"
          icon="x"
          size="sm"
          data-search-clear
          [label]="words().clear"
          (click)="clear()"
        />
      </span>
    } @else if (shortcut() && !hasText() && !disabled()) {
      <!-- Decorativa: la tecla ya la dice `aria-keyshortcuts`. -->
      <kbd
        class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 rounded-sm border border-default px-1 font-mono text-caption text-secondary"
        aria-hidden="true"
        data-search-shortcut
        >{{ shortcut() }}</kbd
      >
    }
  </div>

  <button
    type="button"
    [class]="buttonClasses()"
    data-search-submit
    [attr.aria-label]="words().submit"
    [disabled]="!canSubmit()"
    (click)="submit()"
  >
    <ewms-icon name="search" size="lg" />
  </button>
</div>
