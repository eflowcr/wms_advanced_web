<!--
  Un `<button>` no es un elemento etiquetable, así que la etiqueta visible se une al
  gatillo con aria-labelledby y no con for/id. El texto del gatillo es entonces el
  VALOR, que es lo que espera el patrón combobox.
-->
<span [id]="labelId" class="block text-caption text-secondary mb-1">{{ label() }}</span>

<button
  #trigger
  type="button"
  role="combobox"
  [id]="triggerId"
  [class]="triggerClasses()"
  [style.borderColor]="borderColor()"
  [style.fontSize]="fontSize()"
  [disabled]="isDisabled()"
  [attr.aria-labelledby]="labelId"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="listbox"
  [attr.aria-controls]="controlsId()"
  [attr.aria-activedescendant]="activeOptionId()"
  [attr.aria-invalid]="error() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
  (blur)="onTriggerBlur()"
>
  <span class="truncate" [class]="triggerTextClasses()">{{ triggerText() }}</span>

  <!--
  Decorativo: el botón ya dice qué es y qué contiene. El chevron es `sm` (16 px) en
  todos los tamaños de campo, la misma regla que el icono de prefijo del Input.
-->
  <ewms-icon name="chevron-down" [size]="iconSize" />
</button>

@if (hint()) {
  <p [id]="hintId" class="mt-1 text-caption" [class]="hintClasses()">{{ hint() }}</p>
}

<!--
  El panel, pintado en un overlay del CDK. Nada adentro es enfocable: el foco se
  queda en el gatillo y `aria-activedescendant` apunta a la fila activa, que es el
  patrón de las APG para un combobox de solo selección.
  Por eso las filas no llevan manejador de teclas ni parada de tabulación, y por eso
  hay dos reglas de accesibilidad apagadas abajo: las dos suponen un widget donde
  cada elemento maneja su teclado, y ninguna puede ver desde acá el contrato
  (abajo, arriba, Enter, Escape), que está implementado una vez, en el gatillo.
-->
<ng-template #panel>
  <ul [id]="listboxId" role="listbox" [class]="panelClasses" [attr.aria-labelledby]="labelId">
    @for (option of options(); track $index) {
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
      <li
        [id]="optionId($index)"
        role="option"
        [class]="optionClasses($index)"
        [style.fontSize]="fontSize()"
        [style.fontWeight]="$index === selectedIndex() ? selectedWeight : null"
        [attr.aria-selected]="$index === selectedIndex()"
        (mousedown)="onOptionMousedown($event)"
        (click)="choose(option)"
        (mouseenter)="onOptionEnter($index)"
      >
        <span class="truncate">{{ option.label }}</span>

        @if ($index === selectedIndex()) {
          <ewms-icon name="check" [size]="iconSize" />
        }
      </li>
    }
  </ul>
</ng-template>
