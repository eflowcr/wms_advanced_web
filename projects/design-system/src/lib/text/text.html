<ng-template #content><ng-content /></ng-template>

@switch (variant()) {
  @case ('h1') {
    <h1 class="text-h1"><ng-container [ngTemplateOutlet]="content" /></h1>
  }
  @case ('h2') {
    <h2 class="text-h2"><ng-container [ngTemplateOutlet]="content" /></h2>
  }
  @case ('h3') {
    <h3 class="text-h3"><ng-container [ngTemplateOutlet]="content" /></h3>
  }
  @case ('h4') {
    <h4 class="text-h4 uppercase"><ng-container [ngTemplateOutlet]="content" /></h4>
  }
  @case ('p') {
    <p class="text-p"><ng-container [ngTemplateOutlet]="content" /></p>
  }
  @case ('caption') {
    <span class="text-caption text-secondary"><ng-container [ngTemplateOutlet]="content" /></span>
  }
  @case ('mono') {
    <span class="text-mono font-mono"><ng-container [ngTemplateOutlet]="content" /></span>
  }
}
