<!--
  ONE live region, always in the document, whatever the queue holds.

  It is the container that is live and not each toast, and it is here even when
  there is nothing in it. A region that appears along with its first message is
  announced inconsistently -- some screen readers miss content that arrives in
  the same frame the region does -- so the region waits, empty, and only its
  contents change.

  `polite` and never `assertive`: a toast reports something that already
  happened, and cutting into the sentence someone is listening to in order to
  say "saved" is worse than saying it a moment later. A message that really
  cannot wait is a Banner with role="alert", which is the other component.
-->
<div [class]="outletClasses" role="status" aria-live="polite" [attr.aria-label]="regionLabel()">
  @for (toast of toasts(); track toast.id) {
    <div [class]="toastClasses + ' ' + surfaceClasses(toast)">
      <!--
        The 4 px leading accent, in the family's SOLID rather than its border.
        Measured: the border tone against this surface is 1.45-1.62:1, an
        accent nobody sees; the solid is 3.71-4.28:1. See feedback.types.ts.
      -->
      <span class="w-1 shrink-0" [class]="accentClasses(toast)" aria-hidden="true"></span>

      <div [class]="bodyClasses">
        <!-- Informative, like the banner's: the severity is not readable from
             the colour alone. -->
        <ewms-icon [name]="iconName(toast)" [size]="iconSize" [label]="severityLabel(toast)" />
        <p class="min-w-0 text-p">{{ toast.message }}</p>
      </div>
    </div>
  }
</div>
