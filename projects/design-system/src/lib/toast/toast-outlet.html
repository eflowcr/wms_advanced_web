<!--
  Una región viva, siempre presente aunque vacía: una que aparece con su primer mensaje se anuncia mal.
  `polite`: lo urgente es un Banner con role="alert". Ver vault: Notificaciones.
-->
<div [class]="outletClasses" role="status" aria-live="polite" [attr.aria-label]="regionLabel()">
  @for (toast of toasts(); track toast.id) {
    <div [class]="toastClasses + ' ' + surfaceClasses(toast)">
      <!-- Acento en el solid de la familia, no en el borde (ver feedback.types.ts). -->
      <span class="w-1 shrink-0" [class]="accentClasses(toast)" aria-hidden="true"></span>

      <div [class]="bodyClasses">
        <!-- Informativo, como en el banner: la severidad no se lee solo del color. -->
        <ewms-icon [name]="iconName(toast)" [size]="iconSize" [label]="severityLabel(toast)" />
        <p class="min-w-0 text-p">{{ toast.message }}</p>
      </div>
    </div>
  }
</div>
