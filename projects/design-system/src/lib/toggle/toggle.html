<!-- El `<label>` hace blanco a la fila entera; el pulgar es hermano (un `<input>` no tiene hijos). -->
<label [class]="rowClasses()">
  <span class="relative inline-flex">
    <input
      type="checkbox"
      role="switch"
      [class]="trackClasses()"
      [checked]="checked()"
      [disabled]="disabled()"
      [attr.aria-checked]="checked() ? 'true' : 'false'"
      [attr.aria-label]="ariaLabel() || null"
      [attr.aria-invalid]="showError() ? 'true' : null"
      [attr.aria-describedby]="fieldError() ? noteId : null"
      (change)="onNativeChange($event)"
      (blur)="onBlur()"
    />
    <span [class]="thumbClasses()" aria-hidden="true"></span>
  </span>

  @if (label()) {
    <span>{{ label() }}{{ required() ? ' *' : '' }}</span>
  }

  <!-- En la misma fila: el host es `inline-flex` y una línea debajo rompería toda la maqueta. -->
  @if (fieldError()) {
    <span [id]="noteId" data-field-note class="text-caption text-danger">{{ fieldError() }}</span>
  }
</label>
