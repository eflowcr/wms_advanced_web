<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" aria-hidden="true">
  <!--
    Éxito del login: una ruta de login-routes.svg se ilumina hacia el formulario, en 600 ms con la
    curva ease-out del sistema; entera con prefers-reduced-motion. Color navy-97 escrito: una imagen no
    lee las variables. Ver vault: App-Shell.
  -->
  <style>
    path { fill: none; stroke: #f6f7f8; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 600ms cubic-bezier(0.2, 0, 0, 1) both; }
    circle { fill: #f6f7f8; animation: arrive 600ms cubic-bezier(0.2, 0, 0, 1) both; }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes arrive { 0%, 60% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { path, circle { animation: none; } }
  </style>
  <path pathLength="1" d="M-20 760 C 40 740, 90 720, 130 700 C 300 640, 520 560, 700 480 C 760 490, 800 495, 830 500" />
  <circle cx="700" cy="480" r="5" />
</svg>
