<!doctype html>
<!-- Idioma por defecto (ADR 0008); LanguageService lo reescribe antes del primer render. -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP estricta (PLN-WMS-003 §4), primera en <head> para regir todo lo que sigue. Nada en línea:
      lo bloquea en silencio y lo vigila tools/ci/host-page.test.mjs. En <meta> se ignora
      frame-ancestors: el anti-clickjacking tiene que llegar como cabecera HTTP del servidor.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>eWMS Advance</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="16x16" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- El texto es español: el subset latin siempre hace falta; precargarlo evita el parpadeo. -->
    <link
      rel="preload"
      href="fonts/montserrat-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Estilos del aviso de abajo, fuera del bundle a propósito (ver el archivo). -->
    <link rel="stylesheet" href="startup-failure.css" />
  </head>
  <body>
    <app-root></app-root>
    <!--
      Aviso del caso B, lo revela main.ts. Bilingüe y a mano porque lo que falló es i18n; cada
      línea con su lang. Único texto de UI escrito a mano: la compuerta 12 exime esta página.
    -->
    <div id="startup-failure" class="startup-failure" hidden>
      <main class="startup-failure__panel">
        <h1 class="startup-failure__brand">eWMS Advance</h1>
        <div role="alert">
          <p class="startup-failure__message" lang="es">
            No se pudo cargar el idioma de la interfaz. Vuelva a intentarlo; si el problema
            continúa, avise a soporte.
          </p>
          <p class="startup-failure__message" lang="en">
            The interface language could not be loaded. Please try again; if the problem
            continues, contact support.
          </p>
        </div>
        <button type="button" class="startup-failure__retry">
          <span lang="es">Reintentar</span> / <span lang="en">Try again</span>
        </button>
      </main>
    </div>
  </body>
</html>
