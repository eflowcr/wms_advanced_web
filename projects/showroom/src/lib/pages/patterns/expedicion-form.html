<!--
  Sin role: el contenedor del CDK pone role="dialog", aria-modal y la trampa de foco.
  `[ewmsForm]` junta las tres puertas de envío (Enter, «Guardar» y Ctrl+S) en un solo `submit()`,
  que solo corre la acción si el formulario es válido. Ver vault: Patron-Formulario.
-->
<form
  [ewmsForm]="alta"
  [ewmsFormAction]="save"
  #pattern="ewmsForm"
  class="flex w-full max-w-120 flex-col gap-4 rounded-dialog border border-default border-solid bg-surface p-6 shadow-dialog"
  data-expedicion-form
>
  <h2 [id]="titleId" class="text-h3 text-primary">
    @if (isNew) {
      {{ 'showroom.common.shipmentForm.title.new' | transloco }}
    } @else {
      {{ 'showroom.common.shipmentForm.title.edit' | transloco }}
    }
  </h2>

  <ewms-input
    [label]="'showroom.common.shipmentForm.code' | transloco"
    [placeholder]="codePlaceholder"
    [hint]="'showroom.common.shipmentForm.codeHint' | transloco"
    [formField]="alta.codigo"
    data-form-codigo
  />

  <ewms-input
    [label]="'showroom.common.shipmentForm.customer' | transloco"
    [placeholder]="customerPlaceholder"
    [formField]="alta.cliente"
    data-form-cliente
  />

  <ewms-select
    [label]="'showroom.common.shipmentForm.state' | transloco"
    [options]="estados()"
    [formField]="alta.estado"
    data-form-estado
  />

  <!--
    Toggle y no Checkbox aunque haya Guardar: «urgente» no cambia nada hasta guardar igual,
    y el interruptor se lee como propiedad de la expedición, no como orden al formulario.
  -->
  <ewms-toggle
    [label]="'showroom.common.shipmentForm.urgent' | transloco"
    [formField]="alta.urgente"
    data-form-urgente
  />

  <p
    class="text-caption text-secondary"
    [ewmsProse]="'showroom.common.shipmentForm.keyboard' | transloco"
  ></p>

  <!-- Cancelar primero en el DOM: el CDK enfoca el primer tabulable y debe ser la respuesta segura. -->
  <div class="flex w-full justify-end gap-2">
    <ewms-button variant="secondary" data-form-cancel (click)="cancel()">
      {{ 'showroom.common.shipmentForm.cancel' | transloco }}
    </ewms-button>
    <!-- Guardar nunca se deshabilita: al enviar con errores se muestra el resumen y se enfoca. -->
    <ewms-button variant="primary" type="submit" [loading]="pattern.busy()" data-form-save>
      {{ 'showroom.common.shipmentForm.save' | transloco }}
    </ewms-button>
  </div>
</form>
