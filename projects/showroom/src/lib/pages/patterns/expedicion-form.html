<!--
  Sin role: el contenedor del CDK pone role="dialog", aria-modal y la trampa de foco.
  `ewmsForm` junta las tres puertas de envío (Enter, «Guardar» y Ctrl+S) en un solo `(formSubmit)`,
  que solo llega si el formulario es válido. Ver vault: Patron-Formulario.
-->
<form
  ewmsForm
  #alta="ewmsForm"
  [formGroup]="form"
  class="flex w-full max-w-120 flex-col gap-4 rounded-dialog border border-default border-solid bg-surface p-6 shadow-dialog"
  data-expedicion-form
  (formSubmit)="save()"
>
  <h2 [id]="titleId" class="text-h3 text-primary">
    {{ isNew ? 'Nueva expedición' : 'Editar la expedición' }}
  </h2>

  <ewms-input
    label="Código"
    placeholder="EXP-2026-0000"
    hint="El código que llevará la etiqueta."
    formControlName="codigo"
    data-form-codigo
  />

  <ewms-input
    label="Cliente"
    placeholder="Distribuidora Andes"
    formControlName="cliente"
    data-form-cliente
  />

  <ewms-select label="Estado" [options]="estados" formControlName="estado" data-form-estado />

  <!--
    Toggle y no Checkbox aunque haya Guardar: «urgente» no cambia nada hasta guardar igual,
    y el interruptor se lee como propiedad de la expedición, no como orden al formulario.
  -->
  <ewms-toggle label="Urgente" formControlName="urgente" data-form-urgente />

  <p class="text-caption text-secondary">
    <kbd class="font-mono">Ctrl</kbd> + <kbd class="font-mono">S</kbd> guarda sin soltar el teclado
    —desde cualquier campo, que es justo donde está el foco cuando se quiere guardar—.
    <kbd class="font-mono">Esc</kbd> cancela, en un solo gesto y sin preguntar.
  </p>

  <!-- Cancelar primero en el DOM: el CDK enfoca el primer tabulable y debe ser la respuesta segura. -->
  <div class="flex w-full justify-end gap-2">
    <ewms-button variant="secondary" data-form-cancel (click)="cancel()"> Cancelar </ewms-button>
    <!-- Guardar nunca se deshabilita: al enviar con errores se muestra el resumen y se enfoca. -->
    <ewms-button variant="primary" type="submit" [loading]="alta.busy()" data-form-save>
      Guardar
    </ewms-button>
  </div>
</form>
