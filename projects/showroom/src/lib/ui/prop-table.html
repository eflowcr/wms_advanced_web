<ewms-doc-table [caption]="caption()" [columns]="columns" [rows]="rows()">
  <ng-template let-row let-column="column">
    @switch (column.id) {
      @case ('name') {
        <code class="font-mono text-primary">{{ row.name }}</code>
      }
      @case ('type') {
        <code class="font-mono text-secondary">{{ row.type }}</code>
      }
      @case ('default') {
        <code class="font-mono text-secondary">{{ row.default }}</code>
      }
      @default {
        <span [ewmsProse]="row.description | transloco"></span>
      }
    }
  </ng-template>
</ewms-doc-table>
