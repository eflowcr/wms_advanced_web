<!--
  A table wider than its column scrolls sideways, and a region that scrolls
  must be reachable by keyboard: WCAG 2.1.1, axe scrollable-region-focusable.
  Chromium hands a scroller a tab stop by itself, which is the browser
  patching the page; the stop is declared here so it is ours, carries the
  focus ring, and does not depend on a browser feature.
-->
<div
  class="overflow-x-auto outline-none focus-visible:shadow-(--focus-ring-shadow)"
  tabindex="0"
>
  <table class="w-full border-collapse text-caption">
    <caption class="mb-2 text-left text-secondary">{{ caption() }}</caption>
    <thead>
      <tr>
        <th scope="col" class="border-b border-default p-2 text-left text-secondary">Propiedad</th>
        <th scope="col" class="border-b border-default p-2 text-left text-secondary">Tipo</th>
        <th scope="col" class="border-b border-default p-2 text-left text-secondary">Default</th>
        <th scope="col" class="border-b border-default p-2 text-left text-secondary">Que hace</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.name) {
        <tr>
          <th scope="row" class="border-b border-default p-2 text-left align-top">
            <code class="font-mono text-primary">{{ row.name }}</code>
          </th>
          <td class="border-b border-default p-2 align-top">
            <code class="font-mono text-secondary">{{ row.type }}</code>
          </td>
          <td class="border-b border-default p-2 align-top">
            <code class="font-mono text-secondary">{{ row.default }}</code>
          </td>
          <td class="border-b border-default p-2 align-top text-primary">{{ row.description }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
