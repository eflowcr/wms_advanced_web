<div class="overflow-x-auto">
  <table class="w-full border-collapse text-caption">
    <caption class="mb-2 text-left text-secondary">{{ caption() }}</caption>
    <thead>
      <tr>
        <th scope="col" class="border-b border-default p-2 text-left text-secondary">
          {{ rowHeader() }}
        </th>
        @for (state of states(); track state.id) {
          <th scope="col" class="border-b border-default p-2 text-left text-secondary">
            {{ state.label }}
          </th>
        }
      </tr>
    </thead>
    <tbody>
      @for (variant of variants(); track variant.id) {
        <tr>
          <th scope="row" class="border-b border-default p-2 text-left text-primary">
            {{ variant.label }}
          </th>
          @for (state of states(); track state.id) {
            <td class="border-b border-default p-2 align-middle">
              <ng-container
                [ngTemplateOutlet]="cell()"
                [ngTemplateOutletContext]="{ variant, state }"
              />
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
