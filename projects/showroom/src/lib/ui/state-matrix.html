<ewms-doc-table [caption]="caption()" [columns]="columns()" [rows]="variants()" align="middle">
  <ng-template let-variant let-column="column">
    @if (column.id === rowColumn) {
      {{ variant.label | transloco }}
    } @else {
      <ng-container
        [ngTemplateOutlet]="cell()"
        [ngTemplateOutletContext]="{ variant, state: column }"
      />
    }
  </ng-template>
</ewms-doc-table>
